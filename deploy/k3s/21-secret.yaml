# 敏感配置模板（登录初始账号 + napcat 注入）。请勿把真实值提交进仓库！
# 推荐用 kubectl 直接创建（见 docs/deploy-k3s.md「创建 Secret」）：
#   kubectl -n controlcenter create secret generic device-panel-secret \
#     --from-literal=DevicePanel__Auth__InitialUsername=admin \
#     --from-literal=DevicePanel__Auth__InitialPassword='<强密码>' \
#     --from-literal=DevicePanel__Alert__Napcat__BaseUrl='http://<napcat 地址>:3000' \
#     --from-literal=DevicePanel__Alert__Napcat__Token='<napcat token>' \
#     --from-literal=DevicePanel__Alert__Napcat__TargetType=group \
#     --from-literal=DevicePanel__Alert__Napcat__TargetId='<QQ 群号或私聊号>'
# 说明：
#   - 初始账号/密码仅在用户表为空时生效；napcat 各项仅在面板 KV 设置为空时种子写入，
#     之后以面板 UI 保存为准（改 Secret 不会覆盖 UI 已保存的配置）。
apiVersion: v1
kind: Secret
metadata:
  name: device-panel-secret
  namespace: controlcenter
  labels:
    app.kubernetes.io/part-of: controlcenter
type: Opaque
stringData:
  DevicePanel__Auth__InitialUsername: admin
  DevicePanel__Auth__InitialPassword: CHANGE-ME-strong-password
  DevicePanel__Alert__Napcat__BaseUrl: http://napcat.example:3000
  DevicePanel__Alert__Napcat__Token: CHANGE-ME-napcat-token
  DevicePanel__Alert__Napcat__TargetType: group
  DevicePanel__Alert__Napcat__TargetId: "10001"
